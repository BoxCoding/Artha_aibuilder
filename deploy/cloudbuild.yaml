# Build, test, evaluate, then deploy. The evaluation gates are part of the build: a regression in
# tampering recall or memo groundedness fails the pipeline before anything reaches Cloud Run.
steps:
  - id: install
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -r requirements.txt pytest && pip freeze > /workspace/frozen.txt"]

  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements.txt pytest && python -m pytest tests -q"]

  - id: evaluate
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements.txt && python -m evals.run_evals --n 120"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/artha/api:$SHORT_SHA", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/artha/api:$SHORT_SHA"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - artha
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/artha/api:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=artha-run@$PROJECT_ID.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      - --min-instances=0
      - --max-instances=4
      - --concurrency=20
      - --cpu=2
      - --memory=2Gi
      - --timeout=300
      - --set-env-vars=APP_ENV=prod,LLM_MODE=vertex,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global
      - --set-secrets=SECRET_KEY=artha-session-key:latest

substitutions:
  _REGION: asia-south1

options:
  logging: CLOUD_LOGGING_ONLY
