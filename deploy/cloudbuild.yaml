# Build, test, evaluate, migrate, then deploy. The evaluation gates are part of the build: a
# regression in tampering recall or memo groundedness fails the pipeline before anything reaches
# Cloud Run. Migrations run before the new revision takes traffic, and are written to be
# backwards compatible with the revision still serving.
steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements-dev.txt && python -m pytest tests -q"]

  - id: evaluate
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements.txt && python -m evals.run_evals --n 120"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile", "-t", "${_IMAGE}:$SHORT_SHA", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:$SHORT_SHA"]

  # Schema migrations as a Cloud Run job, so they run inside the VPC with the Cloud SQL connector.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy ledgerlens-migrate --image=${_IMAGE}:$SHORT_SHA --region=${_REGION} \
          --service-account=ledgerlens-run@$PROJECT_ID.iam.gserviceaccount.com \
          --set-cloudsql-instances=${_SQL_INSTANCE} \
          --set-secrets=DATABASE_URL=ledgerlens-database-url:latest \
          --command=alembic --args=upgrade,head --max-retries=0 --task-timeout=600 \
        && gcloud run jobs execute ledgerlens-migrate --region=${_REGION} --wait

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ledgerlens
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=ledgerlens-run@$PROJECT_ID.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --min-instances=1
      - --max-instances=10
      - --concurrency=40
      - --cpu=2
      - --memory=2Gi
      - --timeout=300
      - --set-env-vars=APP_ENV=prod,DEMO_MODE=false,PIPELINE_MODE=queue,LLM_MODE=vertex,TRUST_PROXY_HEADERS=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,WEB_CONCURRENCY=2
      - --set-secrets=SECRET_KEY=ledgerlens-session-key:latest,RECEIPT_SIGNING_SEED=ledgerlens-receipt-seed:latest,DATABASE_URL=ledgerlens-database-url:latest

  # The worker never takes user traffic: internal ingress, CPU always allocated so it can poll.
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ledgerlens-worker
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=ledgerlens-run@$PROJECT_ID.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      - --ingress=internal
      - --no-cpu-throttling
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --min-instances=1
      - --max-instances=4
      - --cpu=2
      - --memory=2Gi
      - --command=python
      - --args=-m,app.worker
      - --set-env-vars=APP_ENV=prod,DEMO_MODE=false,PIPELINE_MODE=queue,LLM_MODE=vertex,PIPELINE_CONCURRENCY=2,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global
      - --set-secrets=SECRET_KEY=ledgerlens-session-key:latest,RECEIPT_SIGNING_SEED=ledgerlens-receipt-seed:latest,DATABASE_URL=ledgerlens-database-url:latest

substitutions:
  _REGION: asia-south1
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ledgerlens/api
  _SQL_INSTANCE: ${PROJECT_ID}:${_REGION}:ledgerlens-db

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
