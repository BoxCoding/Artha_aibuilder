# Build and push the image only; deploy/demo.sh deploys it. The full pipeline with tests and
# evaluation gates is deploy/cloudbuild.yaml.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
