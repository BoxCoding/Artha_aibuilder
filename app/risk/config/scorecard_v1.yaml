# Transparent logistic scorecard for thin-file small-business working-capital loans.
# Coefficients act on capped, documented transforms; signs are monotonic by construction.
# Trained/tuned on the synthetic population only - see docs/MODEL_CARD.md. Not for real lending.
version: scorecard.v1.2026-09
intercept: -1.32
features:
  nach_returns_6m:        {weight: 0.55,  cap_low: 0,    cap_high: 6,   reference: 0,    code: RC-PAYMENT-RETURNS,   actionable: true,  step: -1,    target_floor: 0}
  abb_to_inflow:          {weight: -1.6,  cap_low: 0,    cap_high: 1.0, reference: 0.6,  code: RC-LOW-BALANCE-BUFFER, actionable: true, step: 0.1,   target_ceiling: 1.0}
  inflow_cv:              {weight: 2.4,   cap_low: 0,    cap_high: 1.2, reference: 0.15, code: RC-VOLATILE-INCOME,   actionable: false}
  cash_deposit_share:     {weight: 1.3,   cap_low: 0,    cap_high: 1.0, reference: 0.1,  code: RC-CASH-HEAVY-INCOME, actionable: true,  step: -0.1,  target_floor: 0.05}
  low_balance_days_share: {weight: 2.2,   cap_low: 0,    cap_high: 1.0, reference: 0.0,  code: RC-FREQUENT-LOW-BALANCE, actionable: true, step: -0.05, target_floor: 0}
  obligation_ratio:       {weight: 2.5,   cap_low: 0,    cap_high: 1.0, reference: 0.0,  code: RC-HIGH-EXISTING-DEBT, actionable: false}
  statement_span_months:  {weight: -0.07, cap_low: 0,    cap_high: 12,  reference: 12,   code: RC-SHORT-HISTORY,     actionable: false}
  inflow_trend:           {weight: -0.9,  cap_low: -0.5, cap_high: 0.5, reference: 0.0,  code: RC-DECLINING-INCOME,  actionable: false}
bands:   # upper PD bound (exclusive) for each band
  A: 0.03
  B: 0.06
  C: 0.10
  D: 0.18
  E: 1.01
